<style>

  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

  .lang button{border:0;background:#fff;padding:6px 12px;cursor:pointer;color:var(--muted);font-weight:600}
  .lang button.active{background:var(--brand);color:#fff}

<script>
// ============ INHOUD ============
// Alle inhoud staat in content.json. Dit bestand bevat alleen opmaak en weergave.
// De pipeline bewerkt uitsluitend content.json.
let AFK={};
let SITE={}, ORGANS={}, DISEASES={}, TECHS={}, INDEX=[], CARDS={}, POS={}, TECHPAGES=[];
let editorialNL='', editorialEN='';

async function laadInhoud(){
  const res = await fetch('content.json?v=' + Date.now());
  if(!res.ok) throw new Error('content.json niet gevonden (' + res.status + ')');
  const d = await res.json();
  SITE=d.site; AFK=d.afkortingen||{}; ORGANS=d.organs; DISEASES=d.diseases; TECHS=d.techs;
  INDEX=d.index; CARDS=d.cards; POS=d.pos; TECHPAGES=d.techpages;
  editorialNL=d.editorial.nl; editorialEN=d.editorial.en;
  for(const id of Object.keys(CARDS)){
    CARDS[id].nl.editorial = editorialNL;
    CARDS[id].en.editorial = editorialEN;
  }
  current = INDEX[0].id;
  document.getElementById('bijgewerkt').textContent = d.bijgewerkt;
}

function toonLaadfout(e){
  document.querySelector('main').innerHTML =
    '<div style="max-width:720px;margin:60px auto;padding:24px;border:1px solid #e2e8f0;'+
    'border-radius:12px;background:#fff;font-size:14px;line-height:1.6">'+
    '<b>De inhoud kon niet worden geladen.</b><p>' + e.message + '</p>'+
    '<p>Deze pagina laadt <code>content.json</code> op en dat lukt niet wanneer je het bestand '+
    'rechtstreeks vanaf de schijf opent. Zet beide bestanden op een webserver, of gebruik de '+
    'losse offline-versie.</p></div>';
}
// ============ SITE CHROME (shared across cards) ============
/* SITE -> content.json */

// Facet dictionaries (key -> display per language)
/* ORGANS -> content.json */
/* TECHS -> content.json */
/* DISEASES -> content.json */
// Card index with tags, subtitle and free-text keywords for search
/* INDEX -> content.json */
const SOON={nl:['TACE bij hepatocellulair carcinoom','Binnenkort'],en:['TACE for hepatocellular carcinoma','Coming soon']};
let selOrgan=new Set(), selTech=new Set(), selDis=new Set();

/* editorialNL -> content.json */
/* editorialEN -> content.json */

// ============ CARDS ============
/* CARDS -> content.json */

// ============ RENDER ============
let lang='nl', current='crc-ablatie', currentTech=null;
function setLang(l){
  lang=l; document.documentElement.lang=l;
  document.getElementById('nl').classList.toggle('active',l==='nl');
  document.getElementById('en').classList.toggle('active',l==='en');
  render();
  const zicht = document.getElementById('detail').style.display!=='none' ? ['kaart',current]
              : document.getElementById('tech').style.display!=='none' ? ['techniek',currentTech]
              : ['home',''];
  zetRoute(zicht[0],zicht[1]);
}
const MND={nl:['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'],
           en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']};
const SOORT={guide:{nl:'Richtlijn',en:'Guideline'},core:{nl:'Kern',en:'Core'},
             latest:{nl:'Recent',en:'Latest'},ongoing:{nl:'Lopend',en:'Ongoing'}};
let litFilter='alle', litSort='datum';
function wisselLitSort(){ litSort = litSort==='datum'?'kracht':'datum'; renderLit(); }

function datumLabel(sk){
  const n=Number(sk)||0;
  if(n<190100) return lang==='nl'?'doorlopend':'continuous';
  const j=Math.floor(n/100), m=(n%100)-1;
  return (m>=0&&m<12?MND[lang][m]+' ':'')+j;
}
// ── Bewijskracht: transparante score van 0 tot 100 ───────────────────
// opzet (max 50) + aantal (max 18) + vergelijkend (10) + multicentrisch (10) + tijdschrift (max 12)
const D_PT={meta_rct:50,rct3:48,rct:40,meta:34,prosp:26,retro:15,serie:6,review:4};
const D_NAAM={
  meta_rct:{nl:'meta-analyse van gerandomiseerde trials',en:'meta-analysis of randomised trials'},
  rct3:{nl:'gerandomiseerde fase III-trial',en:'randomised phase III trial'},
  rct:{nl:'gerandomiseerde trial',en:'randomised trial'},
  meta:{nl:'systematische review of meta-analyse',en:'systematic review or meta-analysis'},
  prosp:{nl:'prospectief cohort of register',en:'prospective cohort or registry'},
  retro:{nl:'retrospectief cohort',en:'retrospective cohort'},
  serie:{nl:'patientenserie',en:'case series'},
  review:{nl:'overzichtsartikel',en:'narrative review'}};
function nPunten(n){
  if(!n) return 0;
  const t=[[1000,18],[500,15],[200,12],[100,10],[50,7],[20,4]];
  for(const [g,p] of t) if(n>=g) return p;
  return 2;
}
function tierPunten(t){ return t==='A'?12:t==='B'?8:4; }
function bewijs(p){
  const m=p&&p[6];
  if(!m||!m.d) return null;
  const on=[];
  const d=D_PT[m.d]||0;
  const n=nPunten(m.n); if(!m.n) on.push(lang==='nl'?'aantal niet vermeld':'sample size not stated');
  const c=m.cmp?10:0; if(m.cmp===undefined) on.push(lang==='nl'?'vergelijking onbekend':'comparison unknown');
  const mc=m.mc?10:0;
  const t=tierPunten(m.t);
  const totaal=Math.min(100,d+n+c+mc+t);
  const delen=[`${D_NAAM[m.d][lang]} (${d})`];
  if(m.n) delen.push((lang==='nl'?`${m.n} patienten (${n})`:`${m.n} patients (${n})`));
  if(m.cmp) delen.push((lang==='nl'?`vergelijkend (${c})`:`comparative (${c})`));
  if(m.mc) delen.push((lang==='nl'?`multicentrisch (${mc})`:`multicentre (${mc})`));
  delen.push((lang==='nl'?`tijdschrift ${m.t} (${t})`:`journal ${m.t} (${t})`));
  return {score:totaal, delen:delen, ontbreekt:on};
}
function bandVan(s){ return s>=70?'hoog':s>=45?'mid':'laag'; }
function scorePil(p){
  const b=bewijs(p);
  if(!b) return '';
  const tip=(lang==='nl'?'Bewijskracht ':'Strength of evidence ')+b.score+': '+b.delen.join(' · ');
  return `<span class="bw ${bandVan(b.score)}" title="${tip.replace(/"/g,'&quot;')}">${b.score}</span>`;
}
function scoreUitleg(p){
  const b=bewijs(p);
  if(!b) return '';
  const kop=lang==='nl'?'Bewijskracht':'Strength of evidence';
  const ont=b.ontbreekt.length?` <span class="bwont">(${b.ontbreekt.join(', ')})</span>`:'';
  return `<div class="bwuitleg"><b>${kop} ${b.score}/100:</b> ${b.delen.join(' · ')}${ont}</div>`;
}
function kortBlad(naam){
  const n=(naam||'').trim();
  const m=n.match(/^(.*?)(\s*\([^)]*\))$/);
  const basis=(m?m[1]:n).trim(), staart=m?m[2]:'';
  const kort=AFK[basis];
  return kort?(kort+staart):n;
}
function klapUit(el){
  const open=el.classList.toggle('open');
  el.setAttribute('aria-expanded',open?'true':'false');
}
// Must-read: sterke en recente evidence (bewijskracht hoog + laatste 24 maanden)
function grensMR(){ const n=new Date(); const t=n.getFullYear()*12+n.getMonth()-24; return Math.floor(t/12)*100+(t%12)+1; }
function isMustRead(p){ const b=bewijs(p); return !!(b && b.score>=70 && (Number(p&&p[4])||0)>=grensMR()); }
function mustBadge(){ return `<span class="mrbadge" title="${lang==='nl'?'Sterke, recente evidence':'Strong, recent evidence'}">must read</span>`; }
// Kerngetal: opzet + aantal patiënten uit de gestructureerde bewijsgegevens (altijd correct);
// een expliciete kop in het 8e element gaat voor als die er is.
function kernChip(p){
  if(typeof p[7]==='string' && p[7].trim()) return `<span class="kern">${p[7]}</span>`;
  const s=p[6]; if(!s||!s.d) return '';
  const D={meta_rct:{nl:'meta-RCT',en:'meta-RCT'},rct3:{nl:'RCT',en:'RCT'},rct:{nl:'RCT',en:'RCT'},
    meta:{nl:'meta-analyse',en:'meta-analysis'},prosp:{nl:'prospectief',en:'prospective'},
    retro:{nl:'retrospectief',en:'retrospective'},serie:{nl:'serie',en:'series'},review:{nl:'review',en:'review'}};
  const d=D[s.d]?D[s.d][lang]:''; if(!d) return '';
  const n=s.n?` · ${s.n} ${lang==='nl'?'pt':'pts'}`:'';
  return `<span class="kern">${d}${n}</span>`;
}
function litRegel(p,kind){
  const label=kind==='latest'?'':SOORT[kind][lang];
  const linkTxt=lang==='nl'?'Naar publicatie ↗':'View publication ↗';
  const flagTxt=lang==='nl'?'cijfers te verifiëren':'figures to verify';
  const flagTip=lang==='nl'?'Geen kwantitatieve uitkomst gevonden. Stuur de publicatie om de cijfers in te vullen'
                           :'No quantitative outcome found. Send the publication to fill in the figures';
  const RESSEG=/<b>\s*(?:Resultaten|Results)\s*:?\s*<\/b>([\s\S]*?)(?=<b>|$)/i;
  const NARRATIEF=/narrative review|overzichtsartikel|Review of Anatomy/i;
  const full=p[3], plain=full.replace(/<[^>]+>/g,'');
  const resm=full.match(RESSEG);
  const claimtResultaat=!!resm && !/\d/.test(resm[1].replace(/<[^>]+>/g,''));
  const narratief=NARRATIEF.test(p[0]) || NARRATIEF.test(plain);
  const needsData=(kind==='core'||kind==='latest') && claimtResultaat && !narratief;
  const flag=needsData?`<span class="flag ${kind==='core'?'hoog':'laag'}" title="${flagTip}">⚠</span>`:'';
  const blad=(p[1]||'').replace(/\s*·\s*(?:[A-Za-zÀ-ÿ]{3,9}\.?\s+)?\d{4}\s*$/,'').replace(/\s*·\s*$/,'').trim();
  const aut=p[5]?`<span class="aut">${p[5]}</span>`:'';
  const mr=isMustRead(p)?mustBadge():'';
  return `<div class="lit ${kind}${needsData?' needsdata':''}" onclick="this.classList.toggle('open')">
    <div class="lh"><span class="chev">▸</span>${label?`<span class="badge ${kind}">${label}</span>`:''}<span class="ttl">${p[0]}</span>${flag}${mr}
      <span class="meta2">${aut}${kernChip(p)}<span class="venue" title="${blad.replace(/"/g,'&quot;')}">${kortBlad(blad)}</span>${scorePil(p)}<span class="dat">${datumLabel(p[4])}</span></span></div>
    <div class="sum"><div class="bron">${p[1]}</div>${scoreUitleg(p)}${full} <a href="${p[2]}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${linkTxt}</a></div>
  </div>`;
}
function litHTML(items,kind){
  return items.slice().sort((a,b)=>b[4]-a[4]).map(p=>litRegel(p,kind)).join('');
}
function litAlles(){
  const d=CARDS[current][lang];
  const uit=[];
  ['core','latest','ongoing'].forEach(k=>(d[k]||[]).forEach(p=>uit.push({p:p,k:k})));
  return uit.sort((a,b)=>b.p[4]-a.p[4]);
}
function setLitFilter(v){litFilter=v;renderLit();}
function renderLit(){
  const alles=litAlles();
  const tel={alle:alles.length,core:0,latest:0,ongoing:0};
  alles.forEach(x=>tel[x.k]++);
  const knop=(v,txt)=>`<button class="litchip${litFilter===v?' on':''}${v!=='alle'?' k-'+v:''}" onclick="setLitFilter('${v}')">${txt} <span class="n">${tel[v]}</span></button>`;
  const sorteer=`<button class="litchip srt" onclick="wisselLitSort()">${litSort==='datum'
      ?(lang==='nl'?'sorteer op bewijskracht ↓':'sort by strength ↓')
      :(lang==='nl'?'sorteer op datum ↓':'sort by date ↓')}</button>`;
  document.getElementById('litchips').innerHTML=
    knop('alle',lang==='nl'?'Alles':'All')+knop('core',SOORT.core[lang])+knop('ongoing',SOORT.ongoing[lang])+sorteer;

function suggestPool(){

  Object.values(ORGANS).forEach(o=>pool.push({t:o[lang],c:catOrg}));
  Object.values(TECHS).forEach(x=>pool.push({t:x[lang],c:catTech}));

function renderSuggest(){
  const box=document.getElementById('suggest');
  const val=(document.getElementById('q').value||'');
  const tokens=val.split(/\s+/); const last=(tokens[tokens.length-1]||'').toLowerCase();
  if(last.length<2){box.style.display='none';box.innerHTML='';return;}
  const seen=new Set();
  const hits=suggestPool().filter(o=>{
    const tl=o.t.toLowerCase();
    if(tl===last||seen.has(tl)||!tl.includes(last)) return false;
    seen.add(tl); return true;
  }).slice(0,7);
  if(!hits.length){box.style.display='none';return;}
  box.innerHTML=hits.map(h=>{
    const esc=h.t.replace(/'/g,"\\'").replace(/"/g,'&quot;');
    return `<div class="sopt" onmousedown="pickSuggest('${esc}')"><span class="stag">${h.c}</span><span>${h.t}</span></div>`;
  }).join('');
  box.style.display='block';
}

// belangrijkste niet-IR alternatief, met cijfers over effect EN morbiditeit.
// [[verify]] in een waarde zet het ⚠-signaal aan: cijfers nog aan te leveren.
/* POS -> content.json */

function posHTML(id){
  const p=(POS[id]||{})[lang];
  const L=SITE[lang];
  if(!p) return '';
  // Optie A: 'Kracht van IR'-callout wanneer de kaart een 'sterk'-lijst heeft
  const sterk=(CARDS[id] && CARDS[id][lang] && CARDS[id][lang].sterk) || null;
  const bliksem='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>';
  let callout='';
  if(sterk && sterk.punten && sterk.punten.length){
    const br=sterk.bronnen||[];
    const meer=br.length>1;
    const lbl=lang==='nl'?(meer?'Bronnen':'Bron'):(meer?'Sources':'Source');
    const bronHTML=br.length
      ? `<div class="irbron">${lbl}: ${br.map(b=>b.u?`<a href="${b.u}" target="_blank" rel="noopener">${b.t}</a>`:b.t).join('; ')}</div>`
      : '';
    callout=`<div class="ircallout"><div class="irkop">${bliksem}${lang==='nl'?'Kracht van IR':'Strength of IR'}</div>`
      +`<ul>${sterk.punten.map(s=>`<li>${s}</li>`).join('')}</ul>${bronHTML}</div>`;
  }
  const flagTxt=lang==='nl'?'cijfers te verifiëren':'figures to verify';
  const flagTip=lang==='nl'?'Cijfers nog niet volledig na te trekken. Stuur de publicatie om deze regel af te maken'
                           :'Figures not fully traceable yet. Send the publication to complete this row';
  return callout + [['p_g',p.g],['p_l',p.l],['p_v',p.v]].map(([k,raw])=>{
    const marked=/\[\[verify\]\]/.test(raw||'');
    const txt=String(raw||'').replace(/\s*\[\[verify\]\]\s*/g,' ').trim();
    const plain=txt.replace(/<[^>]+>/g,'');
    // p_g en p_l mogen legitiem zonder getal zijn (geen grootte-grens bestaat).
    // Een vergelijkingsregel zonder enkel getal is altijd een gat.
    const need=marked || (k==='p_v' && !/\d/.test(plain));
    return `<div class="posrow${need?' needsdata':''}"><div class="poslab">${L[k]}${need?` <span class="flag" title="${flagTip}">⚠ ${flagTxt}</span>`:''}</div><div class="posval">${txt}</div></div>`;
  }).join('');
}

function techVanTekst(tekst){
  const t=(tekst||'').toLowerCase();
  const treffers=[];
  Object.keys(TECHS).forEach(k=>{
    const labels=[TECHS[k].nl,TECHS[k].en,k].map(x=>String(x).toLowerCase());
    if(labels.some(l=>l.length>2 && t.includes(l))) treffers.push(k);
  });
  const extra={ 'tare':'TARE','y-90':'TARE','radio-embolisatie':'TARE','radioembolisation':'TARE',
    'tace':'TACE','chemo-embolisatie':'TACE','chemoembolization':'TACE',
    'ire':'IRE','elektroporatie':'IRE','electroporation':'IRE','nanoknife':'IRE',
    'cryoablatie':'CRYO','cryoablation':'CRYO','radiofrequent':'RFA','radiofrequency':'RFA',
    'microwave':'MWA','microgolf':'MWA','embolisatie':'EMB','embolization':'EMB',
    'cementoplastie':'CEM','vertebroplastiek':'CEM','kyphoplasty':'CEM',
    'elektrochemotherapie':'ECT','electrochemotherapy':'ECT' };
  Object.keys(extra).forEach(w=>{ if(t.includes(w) && TECHS[extra[w]] && !treffers.includes(extra[w])) treffers.push(extra[w]); });
  return treffers;
}
function altKaart(titel){
  const hier=INDEX.find(c=>c.id===current);
  if(!hier) return null;
  const techs=techVanTekst(titel);
  if(!techs.length) return null;
  const kand=INDEX.filter(c=>c.id!==current && c.dis.some(x=>hier.dis.includes(x)) && c.tech.some(t=>techs.includes(t)));
  return kand.length?kand[0].id:null;
}
function renderVerwant(){

function lpZet(veld,waarde){
  lpFilters[veld]= veld==='minscore'?Number(waarde):waarde;
  lpAantal=25; renderLitPagina();
}
function renderLitPagina(){
  const alles=lpAlles();
  document.getElementById('lp-titel').textContent=lang==='nl'?'Literatuur':'Literature';
  document.getElementById('lp-sub').textContent=lang==='nl'
    ? 'Alle richtlijnen, publicaties en lopende studies van de site bij elkaar, met filters op periode, onderwerp, tijdschrift, soort en bewijskracht.'
    : 'Every guideline, publication and ongoing trial on the site in one list, with filters for period, topic, journal, type and strength of evidence.';
  renderLitFilters(alles);
  const nu=new Date(); const maanden=Number(lpFilters.periode);
  let zicht=alles.filter(x=>{
    if(lpFilters.kaart && x.id!==lpFilters.kaart) return false;
    if(lpFilters.blad && bladVan(x.venue)!==lpFilters.blad) return false;
    if(lpFilters.soort && x.soort!==lpFilters.soort) return false;
    if(lpFilters.minscore){ const b=bewijs(x.rij); if(!b||b.score<lpFilters.minscore) return false; }
    if(maanden){ const g=new Date(nu.getFullYear(),nu.getMonth()-maanden,1); const grens=g.getFullYear()*100+(g.getMonth()+1);
      if(x.sk<grens) return false; }
    return true;
  });
  zicht.sort((a,b)=>{
    if(lpFilters.sort==='kracht'){ const sa=bewijs(a.rij),sb=bewijs(b.rij);

  meer.textContent = lang==='nl'?`nog ${Math.min(25,zicht.length-lpAantal)} tonen ↓`:`show ${Math.min(25,zicht.length-lpAantal)} more ↓`;

function zetRoute(soort,id){

function tekstUit(html){ return (html||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim(); }
function zetMeta(soort,id){
  const basis='https://www.interventieoncologie.nl/';
  let titel=lang==='nl'?'Interventie Oncologie · de evidence achter interventieradiologie'
                       :'Interventie Oncologie · the evidence behind interventional radiology';
  let oms=SITE[lang]&&SITE[lang].sub?tekstUit(SITE[lang].sub):'';
  if(soort==='kaart' && CARDS[id]){
    const d=CARDS[id][lang];
    titel=d.title+' · Interventie Oncologie';
    oms=tekstUit(d.bl).slice(0,300);
  } else if(soort==='techniek'){
    const tp=TECHPAGES.find(t=>t.id===id);
    if(tp){ titel=tp[lang].title+' · Interventie Oncologie'; oms=tekstUit(tp[lang].lead).slice(0,300); }
  }
  document.title=titel;
  const url=basis+hashVan(soort,id);
  const zet=(el,attr,v)=>{const e=document.getElementById(el); if(e) e.setAttribute(attr,v);};
  zet('m-desc','content',oms); zet('m-ogt','content',titel); zet('m-ogd','content',oms);
  zet('m-ogu','content',url); zet('m-can','href',url);
}
function leesRoute(){
  if(routeBezig) return;
  const h=(location.hash||'').replace(/^#\/?/,'');
  const dl=h.split('/').filter(Boolean);
  const taal=(dl[0]==='nl'||dl[0]==='en')?dl.shift():lang;
  if(taal!==lang){ lang=taal; document.documentElement.lang=taal;
    document.getElementById('nl').classList.toggle('active',taal==='nl');
    document.getElementById('en').classList.toggle('active',taal==='en');
    render(); }
  if(dl[0]==='kaart' && CARDS[dl[1]]) showCard(dl[1],true);
  else if(dl[0]==='techniek' && TECHPAGES.some(t=>t.id===dl[1])) showTech(dl[1],true);
  else if(['literatuur','kaarten','technieken','wijzigingen'].includes(dl[0])) toonPagina(dl[0],true);

}

// zoek een literatuurregel op de kaart via de bron-url
function litViaBron(kaart,bron){
  const c=CARDS[kaart]; if(!c||!bron) return null;
  const d=c[lang]||{};
  for(const k of ['guides','core','latest','ongoing'])
    for(const it of (d[k]||[])) if(it[2]===bron) return it;
  return null;
}
// zoek de bijbehorende literatuurregel op de huidige kaart (voor abstract + score)
function wijzigLit(r){
  const c=CARDS[r.kaart]; if(!c) return null;
  const d=c[lang]||{};
  if(r.bron){ const t=litViaBron(r.kaart,r.bron); if(t) return t; }
  for(const k of ['guides','core','latest','ongoing']){
    for(const it of (d[k]||[])){
      if(it[0]===r.wat) return it;
    }
  }
  return null;
}
// korte beschrijving van wat er op de kaart is veranderd
function watVeranderd(r){
  const c=CARDS[r.kaart];
  const naam=c?(c[lang].title):(r.kort||r.kaart);
  const L={
    core:{nl:'de kernliteratuur',en:'the core literature'},
    latest:{nl:'de recente literatuur',en:'the recent literature'},
    guides:{nl:'de richtlijnen',en:'the guidelines'}};
  const waar=L[r.lijst]?L[r.lijst][lang]:(lang==='nl'?'de literatuurlijst':'the reference list');
  if(r.type==='toegevoegd'||r.type==='richtlijn')
    return lang==='nl'?`Toegevoegd aan ${waar} van de kaart ${naam}.`
                      :`Added to ${waar} of the ${naam} card.`;
  if(r.type==='verwijderd')
    return lang==='nl'?`Verwijderd uit ${waar} van de kaart ${naam}.`
                      :`Removed from ${waar} of the ${naam} card.`;
  if(r.type==='bijgewerkt')
    return lang==='nl'?`De gegevens van deze publicatie op de kaart ${naam} zijn gecorrigeerd.`
                      :`The details of this publication on the ${naam} card were corrected.`;
  if(r.type==='tekst'){
    const FL={bl:{nl:'inleiding',en:'introduction'},crit:{nl:'wanneer geschikt',en:'when suitable'},
      results:{nl:'resultaten',en:'results'},lim:{nl:'beperkingen',en:'limitations'},
      alts:{nl:'alternatieven',en:'alternatives'},pos:{nl:'positie en kracht',en:'position and strength'}};
    const secs=(r.velden||[]).map(f=>FL[f]?FL[f][lang]:f);
    const secTxt=secs.length?` (${secs.join(', ')})`:'';
    if(r.naaraanleiding&&r.naaraanleiding.length)
      return lang==='nl'?`De kaarttekst van ${naam}${secTxt} is aangepast naar aanleiding van nieuwe literatuur:`
                        :`The card text of ${naam}${secTxt} was updated in response to new literature:`;
    return lang==='nl'?`De kaarttekst van ${naam}${secTxt} is herzien.`
                      :`The card text of ${naam}${secTxt} was revised.`;
  }
  if(r.type==='nieuw')
    return lang==='nl'?`Nieuwe kaart ${naam} aan de site toegevoegd.`
                      :`New card ${naam} added to the site.`;
  return '';
}
async function renderWijzig(){
  document.getElementById('w-titel').textContent=lang==='nl'?'Wat is er veranderd':'What changed';
  document.getElementById('w-sub').textContent=lang==='nl'
    ? 'Elke inhoudelijke wijziging aan de kaarten, afgeleid uit het archief van de site'
    : 'Every content change to the cards, derived from the site archive';
  const lijst=document.getElementById('w-lijst');
  if(!wijzigCache){
    lijst.innerHTML=`<p class="refs">${lang==='nl'?'Bezig met ophalen…':'Loading…'}</p>`;
    try{
      const r=await fetch('wijzigingen.json?v='+Date.now());
      if(!r.ok) throw new Error(r.status);
      wijzigCache=(await r.json()).regels||[];
    }catch(e){
      lijst.innerHTML=`<p class="refs">${lang==='nl'
        ?'De lijst met wijzigingen is nu niet op te halen. Probeer het later nog eens.'
        :'The change list cannot be retrieved right now. Please try again later.'}</p>`;
      return;
    }
  }
  const tel={alles:wijzigCache.length};
  Object.keys(WTYPE).forEach(t=>tel[t]=wijzigCache.filter(r=>r.type===t).length);
  const knop=(v,t)=>tel[v]?`<button class="litchip${wFilter===v?' on':''}" onclick="zetWFilter('${v}')">${t} <span class="n">${tel[v]}</span></button>`:'';
  const balk=`<div class="litbar"><span class="litchips">`+knop('alles',lang==='nl'?'Alles':'All')
    +['toegevoegd','richtlijn','tekst','bijgewerkt','verwijderd'].map(t=>knop(t,WTYPE[t][lang])).join('')
    +`</span></div>`;
  const zicht=wFilter==='alles'?wijzigCache:wijzigCache.filter(r=>r.type===wFilter);
  const perMaand={};
  zicht.forEach(r=>{ const k=(r.datum||'').slice(0,7); (perMaand[k]=perMaand[k]||[]).push(r); });
  const maandnaam=k=>{const t=k.split('-'); return MND[lang][Number(t[1])-1]+' '+t[0];};
  lijst.innerHTML=balk+(Object.keys(perMaand).sort().reverse().map(k=>
    `<div class="blokkop">${maandnaam(k)} <span class="evhint">${perMaand[k].length}</span></div>`
    +perMaand[k].map(r=>{
      const naarPub=lang==='nl'?'Naar publicatie ↗':'View publication ↗';
      const naarKaart=lang==='nl'?'Naar de kaart →':'Open the card →';
      const lit=(r.type!=='nieuw'&&r.type!=='verwijderd')?wijzigLit(r):null;
      const bronLink=r.bron?`<a href="${r.bron}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${naarPub}</a>`:'';
      const kaartLink=CARDS[r.kaart]?`<a href="#" onclick="event.stopPropagation();event.preventDefault();showCard('${r.kaart}')">${naarKaart}</a>`:'';
      const aanleiding=(r.type==='tekst'&&r.naaraanleiding&&r.naaraanleiding.length)
        ? r.naaraanleiding.map(a=>{
            const t=litViaBron(r.kaart,a.bron);
            const titel=t?t[0]:a.wat;
            const lnk=a.bron?` <a href="${a.bron}" target="_blank" rel="noopener" onclick="event.stopPropagation()">↗</a>`:'';
            const det=t?`<div class="bron">${t[1]}</div>${kortSam(t[3])}`:'';
            return `<div class="aanl"><div class="aanltitel">${kernChip(t||[])}${titel}${lnk}</div>${det}</div>`;
          }).join('')
        : '';
      const binnen=`<div class="prsam"><div class="watverd">${watVeranderd(r)}</div>`
        +(lit?`<div class="bron">${lit[1]}</div>${scoreUitleg(lit)}${kortSam(lit[3])}`:'')
        +aanleiding
        +`<span class="prlinks">${bronLink}${kaartLink}</span></div>`;
      return `<div class="pubrij" role="button" tabindex="0" aria-expanded="false"
        onclick="klapUit(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();klapUit(this)}">
        <div class="prkop">
        <span class="pdat">${Number(r.datum.slice(8))} ${MND[lang][Number(r.datum.slice(5,7))-1]}</span>
        <span class="pkaart ${WTYPE[r.type].kl}">${r.kort||r.kaart}</span>
        <span class="ptitel">${r.wat}</span>
        <span class="pmeta">${WTYPE[r.type][lang]}</span>${lit?scorePil(lit):''}</div>${binnen}</div>`;
    }).join('')).join('')
    || `<p class="noresults">${lang==='nl'?'Niets gevonden.':'Nothing found.'}</p>`);
}

// ── Sneltoetsen ──────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  const veld=document.getElementById('q');
  const inVeld=document.activeElement===veld;
  if(e.key==='/' && !inVeld){ e.preventDefault(); showHome(); veld.focus(); veld.select(); return; }
  if(e.key==='Escape' && inVeld){ veld.value=''; applyFilters(); veld.blur(); return; }
  if(inVeld && (e.key==='ArrowDown'||e.key==='Enter')){
    const eerste=document.querySelector('#pubhits .pubrij, #cardlist .cardlink');
    if(eerste){ e.preventDefault(); if(e.key==='Enter') eerste.click(); else eerste.focus(); }
    return;
  }
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    const rijen=[...document.querySelectorAll('#pubhits .pubrij, #cardlist .cardlink, #nieuwste .pubrij')];
    const i=rijen.indexOf(document.activeElement);
    if(i>=0){ e.preventDefault(); const j=e.key==='ArrowDown'?Math.min(i+1,rijen.length-1):Math.max(i-1,0); rijen[j].focus(); }
  }
});
(async function start(){
  try { await laadInhoud(); } catch(e){ toonLaadfout(e); return; }
  render();
  leesRoute();
  if(window.innerWidth>860 && document.getElementById('home').style.display!=='none'){
    const q=document.getElementById('q'); if(q) q.focus();
  }
})();
